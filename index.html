<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香港天氣資訊 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            box-sizing: border-box;
        }
        .weather-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            backdrop-filter: blur(10px);
        }
        .station-card {
            transition: all 0.3s ease;
        }
        .station-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .loading {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        /* Remove any highlighting from temperature display */
        .station-card * {
            background: none !important;
            background-color: transparent !important;
            box-shadow: none !important;
            outline: none !important;
        }
        /* Specifically target temperature text to remove highlighting */
        .station-card .text-2xl {
            background: transparent !important;
            background-color: transparent !important;
            box-shadow: none !important;
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-highlight: none !important;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">🌤️ 香港天氣資訊</h1>
            <p class="text-gray-600">香港天文台實時天氣數據</p>
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-12">
            <div class="loading text-2xl text-blue-600">載入中...</div>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-6">
            <strong>錯誤：</strong>無法載入天氣資料，請稍後再試。
        </div>

        <!-- Current Location Weather -->
        <div id="currentLocationWeather" class="hidden weather-card rounded-2xl p-6 text-white mb-8 shadow-xl">
            <div class="text-center">
                <h2 class="text-2xl font-bold mb-3">📍 您的位置</h2>
                <div id="currentLocationInfo" class="text-base mb-3"></div>
                
                <!-- Temperature and Rainfall Row -->
                <div class="flex justify-center items-center space-x-8 mb-3">
                    <div class="text-center">
                        <div class="text-sm text-white/80 mb-1">氣溫</div>
                        <div id="currentLocationTemp" class="text-3xl font-bold"></div>
                    </div>
                    <div class="w-px h-12 bg-white/30"></div>
                    <div class="text-center">
                        <div class="text-sm text-white/80 mb-1">雨量</div>
                        <div id="currentLocationRainfall" class="text-3xl font-bold"></div>
                    </div>
                </div>
                
                <div id="currentLocationDetails" class="text-sm text-white/80"></div>
            </div>
        </div>

        <!-- Main Weather Info -->
        <div id="mainWeather" class="hidden weather-card rounded-2xl p-8 text-white mb-8 shadow-xl">
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <h2 class="text-2xl font-semibold mb-4">當前天氣概況</h2>
                    <div id="condition" class="text-lg leading-relaxed"></div>
                    <div id="humidity" class="text-lg mt-2"></div>
                </div>
                <div>
                    <h3 class="text-xl font-semibold mb-4">更新時間</h3>
                    <div id="updateTime" class="text-lg"></div>
                </div>
            </div>
        </div>

        <!-- Warning Messages -->
        <div id="warningSection" class="hidden mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">⚠️ 警告信息</h2>
            <div id="warningList" class="bg-yellow-100 border border-yellow-400 text-yellow-800 px-4 py-3 rounded"></div>
        </div>

        <!-- Tropical Cyclone Message -->
        <div id="tcMessageSection" class="hidden mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">🌀 熱帶氣旋資訊</h2>
            <div id="tcMessage" class="bg-blue-100 border border-blue-400 text-blue-800 px-4 py-3 rounded whitespace-pre-line"></div>
        </div>

        <!-- Temperature Stations -->
        <div id="temperatureSection" class="hidden mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">🌡️ 各區氣溫</h2>
            <div class="mb-4">
                <label for="temperatureSelect" class="block text-sm font-medium text-gray-700 mb-2">選擇地區：</label>
                <select id="temperatureSelect" class="w-full md:w-64 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white text-gray-800">
                    <option value="">請選擇地區</option>
                </select>
            </div>
            <div id="temperatureDisplay" class="hidden bg-white rounded-lg p-6 shadow-md">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 id="temperaturePlace" class="text-xl font-semibold text-gray-800"></h3>
                        <p class="text-sm text-gray-600">氣溫</p>
                    </div>
                    <div id="temperatureValue" class="text-3xl font-bold"></div>
                </div>
            </div>
        </div>

        <!-- Rainfall Stations -->
        <div id="rainfallSection" class="hidden mb-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">🌧️ 各區雨量</h2>
            <p id="rainfallTime" class="text-gray-600 mb-4"></p>
            <div class="mb-4">
                <label for="rainfallSelect" class="block text-sm font-medium text-gray-700 mb-2">選擇地區：</label>
                <select id="rainfallSelect" class="w-full md:w-64 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white text-gray-800">
                    <option value="">請選擇地區</option>
                </select>
            </div>
            <div id="rainfallDisplay" class="hidden bg-white rounded-lg p-6 shadow-md">
                <div class="flex items-center justify-between">
                    <div>
                        <h3 id="rainfallPlace" class="text-xl font-semibold text-gray-800"></h3>
                        <p class="text-sm text-gray-600">過去一小時雨量</p>
                    </div>
                    <div id="rainfallValue" class="text-3xl font-bold"></div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="text-center mt-8 space-x-4">
            <button id="locationBtn" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 shadow-lg">
                📍 獲取我的位置
            </button>
            <button id="refreshBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition duration-300 shadow-lg">
                🔄 重新載入
            </button>
        </div>
    </div>

    <script>
        let weatherData = null;
        let userLocation = null;
        let nearestTempStation = null;
        let nearestRainfallStation = null;
        let temperatureStations = [];
        let rainfallStations = [];

        async function fetchWeatherData() {
            try {
                showLoading();
                const response = await fetch('https://weather-backend.ystudiohk.com/weather');
                
                <!--https://data.weather.gov.hk/weatherAPI/opendata/weather.php-->
                

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                
                weatherData = await response.json();
                await displayWeatherData();
                hideLoading();
            } catch (error) {
                console.error('Error fetching weather data:', error);
                showError();
                hideLoading();
            }
        }

        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('error').classList.add('hidden');
            document.getElementById('currentLocationWeather').classList.add('hidden');
            document.getElementById('mainWeather').classList.add('hidden');
            document.getElementById('warningSection').classList.add('hidden');
            document.getElementById('tcMessageSection').classList.add('hidden');
            document.getElementById('temperatureSection').classList.add('hidden');
            document.getElementById('temperatureDisplay').classList.add('hidden');
            document.getElementById('rainfallSection').classList.add('hidden');
            document.getElementById('rainfallDisplay').classList.add('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function showError() {
            document.getElementById('error').classList.remove('hidden');
        }

        async function displayWeatherData() {
            if (!weatherData) return;

            // Try to find nearest stations if location is already available
            // Don't automatically request location - user must click the button
            if (userLocation) {
                try {
                    if (weatherData.temperature?.length > 0) {
                        nearestTempStation = findNearestStation(weatherData.temperature);
                    }
                    
                    if (weatherData.rainfall?.length > 0) {
                        nearestRainfallStation = findNearestStation(weatherData.rainfall);
                    }
                    
                    displayCurrentLocationWeather();
                } catch (error) {
                    console.log('Error finding nearest stations:', error.message);
                }
            }

            // Main Weather Info
            document.getElementById('condition').textContent = weatherData.icon ? `天氣狀況: ${weatherData.icon}` : '暫無資料';
            document.getElementById('humidity').textContent = weatherData.humidity && weatherData.humidity.length > 0 ? `濕度: ${weatherData.humidity[0].value}%` : '暫無資料';
            document.getElementById('updateTime').textContent = weatherData.updateTime 
                ? new Date(weatherData.updateTime).toLocaleString('zh-HK') 
                : '暫無資料';
            document.getElementById('mainWeather').classList.remove('hidden');

            // Warning Messages
            if (weatherData.warningMessage?.length > 0) {
                document.getElementById('warningList').innerHTML = weatherData.warningMessage
                    .map(msg => `<p>${msg}</p>`).join('');
                document.getElementById('warningSection').classList.remove('hidden');
            }

            // Tropical Cyclone Message
            if (weatherData.tcMessage?.length > 0) {
                document.getElementById('tcMessage').textContent = weatherData.tcMessage.join('\n');
                document.getElementById('tcMessageSection').classList.remove('hidden');
            }

            // Temperature Data
            if (weatherData.temperature?.length > 0) {
                temperatureStations = weatherData.temperature;
                populateTemperatureDropdown(weatherData.temperature);
                document.getElementById('temperatureSection').classList.remove('hidden');
                document.getElementById('temperatureSelect').value = '';
                document.getElementById('temperatureDisplay').classList.add('hidden');
            }

            // Rainfall Data
            if (weatherData.rainfall?.length > 0) {
                rainfallStations = weatherData.rainfall;
                populateRainfallDropdown(weatherData.rainfall);
                document.getElementById('rainfallTime').textContent = weatherData.rainfallTime?.startTime && weatherData.rainfallTime?.endTime 
                    ? `記錄時間: ${new Date(weatherData.rainfallTime.startTime).toLocaleString('zh-HK')} 至 ${new Date(weatherData.rainfallTime.endTime).toLocaleString('zh-HK')}`
                    : '暫無時間資料';
                document.getElementById('rainfallSection').classList.remove('hidden');
                document.getElementById('rainfallSelect').value = '';
                document.getElementById('rainfallDisplay').classList.add('hidden');
            }
        }

        function populateTemperatureDropdown(tempData) {
            const select = document.getElementById('temperatureSelect');
            select.innerHTML = '<option value="">請選擇地區</option>';
            
            tempData.forEach((station, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = station.place || '未知地區';
                select.appendChild(option);
            });
        }

        function populateRainfallDropdown(rainData) {
            const select = document.getElementById('rainfallSelect');
            select.innerHTML = '<option value="">請選擇地區</option>';
            
            rainData.forEach((station, index) => {
                const option = document.createElement('option');
                option.value = index;
                option.textContent = station.place || '未知地區';
                select.appendChild(option);
            });
        }

        function displaySelectedTemperature(index) {
            if (index === '' || !temperatureStations[index]) {
                document.getElementById('temperatureDisplay').classList.add('hidden');
                return;
            }

            const station = temperatureStations[index];
            const temp = station.value !== undefined ? `${station.value}°C` : '暫無資料';
            const tempColor = getTemperatureColor(station.value);

            document.getElementById('temperaturePlace').textContent = station.place || '未知地區';
            const valueElement = document.getElementById('temperatureValue');
            valueElement.textContent = temp;
            valueElement.className = `text-3xl font-bold ${tempColor}`;
            document.getElementById('temperatureDisplay').classList.remove('hidden');
        }

        function displaySelectedRainfall(index) {
            if (index === '' || !rainfallStations[index]) {
                document.getElementById('rainfallDisplay').classList.add('hidden');
                return;
            }

            const station = rainfallStations[index];
            const rainfall = station.max !== undefined ? `${station.max}mm` : '暫無資料';
            const rainColor = getRainfallColor(station.max);

            document.getElementById('rainfallPlace').textContent = station.place || '未知地區';
            const valueElement = document.getElementById('rainfallValue');
            valueElement.textContent = rainfall;
            valueElement.className = `text-3xl font-bold ${rainColor}`;
            document.getElementById('rainfallDisplay').classList.remove('hidden');
        }

        function getTemperatureColor(temp) {
            if (temp === undefined || temp === null) return 'text-gray-500';
            if (temp >= 30) return 'text-red-500';
            if (temp >= 25) return 'text-orange-500';
            if (temp >= 20) return 'text-yellow-500';
            if (temp >= 15) return 'text-green-500';
            return 'text-blue-500';
        }

        function getRainfallColor(rainfall) {
            if (rainfall === undefined || rainfall === null) return 'text-gray-500';
            if (rainfall >= 10) return 'text-blue-600';
            if (rainfall >= 5) return 'text-blue-500';
            if (rainfall >= 1) return 'text-blue-400';
            return 'text-gray-400';
        }

        // GPS Location Functions
        function getCurrentLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject(new Error('Geolocation is not supported by your browser'));
                    return;
                }

                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLocation = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude
                        };
                        console.log('Location obtained:', userLocation);
                        resolve(userLocation);
                    },
                    (error) => {
                        console.error('Error getting location:', error);
                        reject(error);
                    },
                    {
                        enableHighAccuracy: true,
                        timeout: 10000,
                        maximumAge: 0
                    }
                );
            });
        }

        // Calculate distance between two coordinates using Haversine formula
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth's radius in kilometers
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; // Distance in kilometers
        }

        // Find nearest station based on GPS coordinates
        function findNearestStation(stations) {
            if (!userLocation || !stations || stations.length === 0) {
                return null;
            }

            let nearestStation = null;
            let minDistance = Infinity;

            // Hong Kong weather station coordinates (approximate)
            // If stations have coordinates, use them; otherwise use place name mapping
            const stationCoordinates = {
                '中環': { lat: 22.2819, lon: 114.1556 },
                '香港天文台': { lat: 22.3027, lon: 114.1773 },
                '京士柏': { lat: 22.3114, lon: 114.1747 },
                '黃竹坑': { lat: 22.2464, lon: 114.1694 },
                '打鼓嶺': { lat: 22.5347, lon: 114.1417 },
                '流浮山': { lat: 22.4708, lon: 113.9856 },
                '沙田': { lat: 22.3792, lon: 114.1894 },
                '屯門': { lat: 22.3947, lon: 113.9728 },
                '將軍澳': { lat: 22.3075, lon: 114.2569 },
                '西貢': { lat: 22.3144, lon: 114.2611 },
                '長洲': { lat: 22.2067, lon: 114.0281 },
                '赤鱲角': { lat: 22.3081, lon: 113.9181 },
                '青衣': { lat: 22.3542, lon: 114.1081 },
                '石崗': { lat: 22.4342, lon: 114.0811 },
                '荃灣': { lat: 22.3708, lon: 114.1125 },
                '九龍城': { lat: 22.3208, lon: 114.1894 },
                '觀塘': { lat: 22.3111, lon: 114.2258 },
                '跑馬地': { lat: 22.2708, lon: 114.1819 },
                '深水埗': { lat: 22.3308, lon: 114.1611 },
                '啟德': { lat: 22.3081, lon: 114.2147 }
            };

            stations.forEach(station => {
                let stationLat, stationLon;

                // Try to get coordinates from station data first
                if (station.lat && station.lon) {
                    stationLat = station.lat;
                    stationLon = station.lon;
                } else if (station.latitude && station.longitude) {
                    stationLat = station.latitude;
                    stationLon = station.longitude;
                } else if (station.place && stationCoordinates[station.place]) {
                    // Use mapped coordinates based on place name
                    stationLat = stationCoordinates[station.place].lat;
                    stationLon = stationCoordinates[station.place].lon;
                } else {
                    // Skip if no coordinates available
                    return;
                }

                const distance = calculateDistance(
                    userLocation.latitude,
                    userLocation.longitude,
                    stationLat,
                    stationLon
                );

                if (distance < minDistance) {
                    minDistance = distance;
                    nearestStation = { ...station, distance: distance };
                }
            });

            return nearestStation;
        }

        // Display current location weather
        function displayCurrentLocationWeather() {
            if (!userLocation || (!nearestTempStation && !nearestRainfallStation)) {
                document.getElementById('currentLocationWeather').classList.add('hidden');
                return;
            }

            // Display location info
            const locationInfo = `緯度: ${userLocation.latitude.toFixed(4)}, 經度: ${userLocation.longitude.toFixed(4)}`;
            document.getElementById('currentLocationInfo').textContent = locationInfo;

            // Display temperature
            if (nearestTempStation) {
                const temp = nearestTempStation.value !== undefined 
                    ? `${nearestTempStation.value}°C` 
                    : '暫無資料';
                const tempElement = document.getElementById('currentLocationTemp');
                tempElement.textContent = temp;
                // Use white text for visibility on gradient background
                tempElement.className = 'text-3xl font-bold text-white';
            } else {
                document.getElementById('currentLocationTemp').textContent = '暫無資料';
                document.getElementById('currentLocationTemp').className = 'text-3xl font-bold text-white';
            }

            // Display rainfall
            if (nearestRainfallStation) {
                const rainfall = nearestRainfallStation.max !== undefined 
                    ? `${nearestRainfallStation.max}mm` 
                    : '暫無資料';
                const rainElement = document.getElementById('currentLocationRainfall');
                rainElement.textContent = rainfall;
                // Use white text for visibility on gradient background
                rainElement.className = 'text-3xl font-bold text-white';
            } else {
                document.getElementById('currentLocationRainfall').textContent = '暫無資料';
                document.getElementById('currentLocationRainfall').className = 'text-3xl font-bold text-white';
            }

            // Display details
            let details = [];
            if (nearestTempStation) {
                details.push(`最近氣溫站: ${nearestTempStation.place || '未知'}`);
                if (nearestTempStation.distance) {
                    details.push(`距離: ${nearestTempStation.distance.toFixed(2)} 公里`);
                }
            }
            if (nearestRainfallStation && nearestRainfallStation.place !== nearestTempStation?.place) {
                details.push(`最近雨量站: ${nearestRainfallStation.place || '未知'}`);
                if (nearestRainfallStation.distance) {
                    details.push(`距離: ${nearestRainfallStation.distance.toFixed(2)} 公里`);
                }
            }
            document.getElementById('currentLocationDetails').textContent = details.join(' • ');

            document.getElementById('currentLocationWeather').classList.remove('hidden');
        }

        // Handle location button click
        async function handleLocationButtonClick() {
            try {
                const button = document.getElementById('locationBtn');
                button.disabled = true;
                button.textContent = '📍 獲取位置中...';

                await getCurrentLocation();

                if (weatherData) {
                    if (weatherData.temperature?.length > 0) {
                        nearestTempStation = findNearestStation(weatherData.temperature);
                    }
                    if (weatherData.rainfall?.length > 0) {
                        nearestRainfallStation = findNearestStation(weatherData.rainfall);
                    }
                    displayCurrentLocationWeather();
                }

                button.disabled = false;
                button.textContent = '📍 獲取我的位置';
            } catch (error) {
                alert('無法獲取您的位置。請確保已允許瀏覽器訪問位置權限。\n\n' + error.message);
                const button = document.getElementById('locationBtn');
                button.disabled = false;
                button.textContent = '📍 獲取我的位置';
            }
        }

        // Event listeners
        document.getElementById('refreshBtn').addEventListener('click', fetchWeatherData);
        document.getElementById('locationBtn').addEventListener('click', handleLocationButtonClick);
        document.getElementById('temperatureSelect').addEventListener('change', (e) => {
            displaySelectedTemperature(e.target.value);
        });
        document.getElementById('rainfallSelect').addEventListener('change', (e) => {
            displaySelectedRainfall(e.target.value);
        });

        // Initial load
        fetchWeatherData();

        // Auto refresh every 10 minutes
        setInterval(fetchWeatherData, 600000);
    </script>
</body>
</html>
